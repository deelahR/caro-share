services:
  - type: web
    name: agribro
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agribro-db
          property: connectionString

databases:
  - name: agribro-db
    databaseName: agribro
    user: agribro
    plan: free
